; PHP per-directory settings picked up automatically by PHP-FPM (and CGI/
; mod_php too) — unlike .htaccess "php_value" lines, which PHP-FPM ignores
; entirely. This is what actually raises the upload limit on most modern
; shared hosting (cPanel/Plesk with PHP-FPM, LiteSpeed, etc.).
;
; Kept in sync with the app's own limits: MAX_FILE_BYTES (20MB, teaching
; PDFs) in admin/resources.php and MAX_FORM_BYTES (15MB, student documents)
; in admin/students.php. post_max_size must be a little larger than
; upload_max_filesize since it caps the whole request, not just the file.
;
; Some hosts cap what a site is allowed to raise this to and will silently
; keep their own lower ceiling — if uploads still fail after this, ask your
; host to raise the limit, or lower MAX_FILE_BYTES/MAX_FORM_BYTES to match
; whatever they allow.
upload_max_filesize = 30M
post_max_size = 35M
memory_limit = 256M
max_execution_time = 60
